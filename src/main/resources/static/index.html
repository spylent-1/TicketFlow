<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TicketFlow 工单工作台</title>
  <link rel="stylesheet" href="/desk.css">
  <script defer src="/desk.js"></script>
</head>
<body>
  <header class="bar">
    <a class="identity" href="/"><span class="mark" aria-hidden="true">T</span>TicketFlow</a>
    <div class="account"><span id="role"></span><form action="/logout" method="post" id="logout"><input type="hidden" name="_csrf"><button class="subtle">退出</button></form></div>
  </header>
  <main>
    <div class="heading">
      <div><p class="section-label">售后支持</p><h1>工单工作台</h1></div>
      <button id="new-ticket" class="primary" disabled>＋ 新建工单</button>
    </div>
    <p id="notice" role="status" hidden></p>
    <div class="workspace">
      <aside aria-label="工单队列">
        <header class="queue-head"><h2>工单队列</h2><span id="count"></span></header>
        <label class="filter">状态筛选
          <select id="filter">
            <option value="">全部工单</option>
            <option value="AWAITING_APPROVAL">待审批</option>
            <option value="RESOLVED">已处理</option>
            <option value="MANUAL">待人工核查</option>
            <option value="REJECTED">已拒绝</option>
          </select>
        </label>
        <nav id="tickets" aria-label="工单列表"></nav>
      </aside>
      <section id="detail" aria-label="工单详情" aria-busy="true">
        <div class="empty"><h2>正在读取工单</h2></div>
      </section>
    </div>
  </main>
  <dialog id="compose">
    <form id="create">
      <header class="dialog-head"><h2>新建工单</h2><button type="button" class="subtle" id="close" aria-label="关闭">关闭</button></header>
      <label>订单号<input name="orderId" maxlength="48" required placeholder="输入订单编号"></label>
      <label>客户反馈<textarea name="description" rows="4" required maxlength="1200" placeholder="描述遇到的问题"></textarea></label>
      <button class="primary">提交并调查</button>
    </form>
  </dialog>
</body>
</html>
